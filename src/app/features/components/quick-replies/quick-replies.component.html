<div class="quick-replies-page">
  <div class="page-header">
    <h2>Respuestas rápidas</h2>
    <button class="btn btn-primary" (click)="showCreateForm()">
      <span class="material-symbols-rounded">add</span> Nueva respuesta
    </button>
  </div>

  @if (showForm) {
    <div class="form-card fade-in">
      <h3>{{ editingId ? 'Editar respuesta' : 'Nueva respuesta' }}</h3>
      <div class="form-grid">
        <div class="field">
          <label>Atajo</label>
          <input class="input" [(ngModel)]="form.shortcut" placeholder="/hola">
          <span class="hint">Debe empezar con /</span>
        </div>
        <div class="field">
          <label>Contenido</label>
          <textarea class="input" [(ngModel)]="form.content" rows="3" placeholder="Texto que se enviará..."></textarea>
        </div>
      </div>
      <div class="form-actions">
        <button class="btn btn-primary" (click)="save()" [disabled]="creating()">
          {{ creating() ? 'Guardando...' : (editingId ? 'Guardar cambios' : 'Crear respuesta') }}
        </button>
        <button class="btn btn-ghost" (click)="cancel()">Cancelar</button>
      </div>
    </div>
  }

  <div class="replies-table">
    <div class="table-header">
      <span>Atajo</span>
      <span>Contenido</span>
      <span>Acciones</span>
    </div>
    @for (r of replies(); track r.id) {
      <div class="table-row">
        <span class="shortcut-badge">{{ r.shortcut }}</span>
        <span class="text-small text-muted reply-content">{{ r.content }}</span>
        <div class="row-actions">
          <button class="btn-icon" (click)="edit(r)" title="Editar">
            <span class="material-symbols-rounded">edit</span>
          </button>
          <button class="btn-icon btn-danger" (click)="remove(r.id)" title="Eliminar">
            <span class="material-symbols-rounded">delete</span>
          </button>
        </div>
      </div>
    }
  </div>
</div>
